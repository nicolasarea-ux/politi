name: Publicar Reels Politízate Hoy
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLICADOR_ACTIVO == 'si' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar los Reels que tocan
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publicar.py
      - name: Estadísticas (cada hora en punto y al lanzarlo a mano)
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '*/15') }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 estadisticas.py || true
      - name: Guardar estado
        run: |
          git config user.name "politizatehoy-bot"
          git config user.email "politizatehoy-bot@users.noreply.github.com"
          git add publicaciones.json stats.json 2>/dev/null || git add publicaciones.json
          git diff --cached --quiet || { git commit -m "Reels publicados"; for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*10)); done; }

  renovar-token:
    # el token de Instagram dura 60 días; se renueva cada lunes y se guarda en el secreto
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLICADOR_ACTIVO == 'si' && github.event.schedule == '*/15 * * * *' }}
    steps:
      - name: Renovar si es lunes a las 6:00 UTC
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$(date -u +%u%H%M)" \< "1060000" ] || [ "$(date -u +%u%H%M)" \> "1061400" ]; then exit 0; fi
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          gh secret set IG_TOKEN --body "$NEW" --repo ${{ github.repository }}
