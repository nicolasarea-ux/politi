<script>
let D,S,ELS=[],SEGS=[],SK;

function bust(who,cara){if(PHOTO[who])return `<div style="position:absolute;inset:0;background:url(${PHOTO[who]}) ${PPOS[who]||'50% 10%'}/cover no-repeat"></div>`;let s=monoSVG(who,{});return s.replace('viewBox="40 20 224 450"','viewBox="62 -6 180 250" preserveAspectRatio="xMidYMin slice"').replace('style="overflow:visible;width:100%;height:100%"','style="width:100%;height:100%"')}

// ----- fondos por skin -----
function buildBG(){const bg=document.getElementById('bg'),fx=document.getElementById('fx'),hud=document.getElementById('hud');let h='';
 if(SK==='f1'){const cols=['#E30613','#5BC236','#1E6FD9','#F28C28','#E30613','#5BC236','#1E6FD9'];
  h+=cols.map((c,i)=>`<div style="position:absolute;top:0;bottom:700px;left:${i*160-40}px;width:70px;background:linear-gradient(${c}00,${c}cc 40%,${c}00);filter:blur(18px);opacity:.55" class="lb" data-i="${i}"></div>`).join('');
  h+=`<div style="position:absolute;left:0;right:0;bottom:0;height:760px;background:linear-gradient(#0e1226,#05060c)"></div><div style="position:absolute;left:-10%;right:-10%;bottom:690px;height:8px;background:linear-gradient(90deg,transparent,#5a7cff,transparent);opacity:.6"></div>`;}
 if(SK==='f3'){for(let i=0;i<90;i++)h+=`<div style="position:absolute;left:${seededRand(i)*1080}px;top:${seededRand(i+50)*1920}px;width:${2+seededRand(i+9)*3}px;height:${2+seededRand(i+9)*3}px;border-radius:50%;background:#fff;opacity:${.15+seededRand(i+3)*.4}" class="star"></div>`}
 if(SK==='f5'){h+=`<div id="lh" style="position:absolute;left:0;top:0;bottom:0;width:540px;background:repeating-linear-gradient(90deg,#c9772f 0 60px,#b8662a 60px 120px);"><div style="position:absolute;inset:0;background:linear-gradient(#0000 50%,#6b3a17 100%)"></div></div><div id="rh" style="position:absolute;right:0;top:0;bottom:0;width:540px;background:linear-gradient(#2c3c74,#e07a5f 70%,#f2b880)"><div style="position:absolute;left:40px;right:40px;bottom:520px;height:380px;display:flex;align-items:flex-end;gap:14px">${[220,300,180,340,260,380,200].map(v=>`<div style="flex:1;height:${v}px;background:#1d2448;opacity:.85"></div>`).join('')}</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(#0000,#0008)"></div><div style="position:absolute;left:536px;top:0;bottom:0;width:8px;background:#fff"></div>`}
 if(SK==='f6'){h+=`<svg width="1080" height="1920" style="position:absolute;inset:0"><filter id="n"><feTurbulence baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .2 0 0 0 .18 0"/></filter>${[[-80,-40,500,520],[620,180,560,600],[-60,900,520,560],[700,1300,500,700],[300,1650,600,420]].map(([x,y,w,hh],i)=>{let p='';for(let k=0;k<18;k++){const a=k/18*Math.PI*2;const r=1+(seededRand(i*31+k)-.5)*.35;p+=`${x+w/2+Math.cos(a)*w/2*r},${y+hh/2+Math.sin(a)*hh/2*r} `}return `<polygon points="${p}" fill="#F07A1A" opacity=".85"/>`}).join('')}<rect width="1080" height="1920" filter="url(#n)"/></svg>`;
  hud.innerHTML=`<div style="position:absolute;left:90px;right:90px;top:120px;height:26px;border-radius:13px;background:#2a2018;box-shadow:0 0 0 6px #efe2c6"><div id="cdb" style="position:absolute;left:0;top:0;bottom:0;border-radius:13px;background:#F07A1A"></div><div id="cdc" style="position:absolute;top:-34px;width:94px;height:94px;margin-left:-47px;border-radius:50%;background:#efe2c6;border:7px solid #2a2018;font-family:PM;font-size:40px;display:flex;align-items:center;justify-content:center;color:#2a2018"></div></div><div style="position:absolute;bottom:250px;width:100%;text-align:center;font-family:PM;font-size:34px;color:#2a201866;letter-spacing:2px">@POLITIZATEHOY</div>`}
 if(SK==='f2'){hud.innerHTML=`<div style="position:absolute;left:40px;right:40px;top:110px;display:flex;gap:10px;font-family:I;font-weight:900;font-size:30px">${['?','1','2','3','4','TÚ'].map((x,i)=>`<div class="pb" data-i="${i}" style="flex:${i==0?.4:1};height:44px;border:4px solid #111;display:flex;align-items:center;justify-content:center;background:#FFCF00;color:#111">${x}</div>`).join('')}</div><div style="position:absolute;left:44px;right:44px;top:172px;display:flex;justify-content:space-between;font-family:I;font-weight:900;font-size:28px;color:#111"><span>🔴 Situación a ${D.fechaTxt||'26 de noviembre de 2026'}</span><span>@politizatehoy</span></div><div id="masc" style="position:absolute;right:110px;top:960px;width:150px;height:190px">${URNA}</div>`}
 bg.insertAdjacentHTML('beforeend',h)}

// ----- elementos -----
function mk(e){const d=document.createElement('div');d.className='el';const k=e.k;let w=e.w||400,h=e.h||w;
 const P=e.p||WHO2P[e.who]||'pp',C=e.c||PC[P]||'#3aa0ff';d.style.setProperty('--c',C);
 if(k==='por'){h=e.h||w*1.2;d.innerHTML=`<div class="por" style="position:absolute;inset:0"><div class="ph">${bust(e.who)}</div></div>`+(e.label?`<div style="position:absolute;left:50%;bottom:-${SK==='f2'||SK==='f6'?70:90}px;transform:translateX(-50%);white-space:nowrap;${SK==='f1'?`background:${C};color:#fff;font-family:AN;font-size:58px;padding:4px 36px;`:SK==='f6'?'font-family:PM;font-size:46px;color:#111;background:#fff;padding:2px 22px;':'font-family:I;font-weight:900;font-size:44px;color:#111;background:#fff;padding:4px 20px;border-radius:8px;'}">${e.label}</div>`:'')}
 else if(k==='mono'){h=w*2;d.innerHTML=full(e.who)}
 else if(k==='big'){w=e.w||960;h=e.h||(e.fs||140)*1.3*(e.lines||1)+(e.sub?80:0);d.innerHTML=`<div class="big" style="text-align:center;font-size:${e.fs||140}px;line-height:1.02;${e.color?`color:${e.color};`:''}">${e.tx}</div>${e.sub?`<div style="text-align:center;font-family:${SK==='f6'?'PM':SK==='f1'?'AN':'I'};font-weight:900;font-size:${e.subfs||46}px;color:${e.subc||(SK==='f2'||SK==='f6'?'#111':'#fff')};margin-top:6px;letter-spacing:1px">${e.sub}</div>`:''}`}
 else if(k==='stat'){w=e.w||560;h=e.h||260;d.innerHTML=`<div class="stat" style="position:absolute;inset:0"><b style="font-size:${e.fs||110}px">${e.tx}</b><span style="display:block;font-size:${e.subfs||40}px;margin-top:8px;line-height:1.05">${e.sub||''}</span></div>`}
 else if(k==='emo'){w=e.w||e.fs||220;h=w;d.innerHTML=`<div class="emo" style="font-size:${e.fs||200}px">${e.e}</div>`}
 else if(k==='tape'){w=e.w||820;h=(e.fs||90)*1.4;d.innerHTML=`<div style="text-align:center"><span class="tape" style="font-size:${e.fs||90}px;display:inline-block;transform:rotate(${e.rot||-2}deg)">${e.tx}</span></div>`}
 else if(k==='card'){w=e.w||760;h=e.h||520;d.innerHTML=`<div class="card" style="position:absolute;inset:0">${e.title?`<h4>${e.title}</h4>`:''}${(e.lines||[]).map(l=>`<div class="ln ${l.hl?'hl':''}"><span>${l.a}</span><span>${l.b||''}</span></div>`).join('')}</div>`}
 else if(k==='podios'){w=1080;h=560;const L=[['feijoo','pp','PP'],['sanchez','psoe','PSOE'],['abascal','vox','VOX'],['colau','fa','FRENTE AMPLIO']];d.innerHTML=L.map(([who,p,lab],i)=>`<div class="pod" data-p="${p}" style="position:absolute;left:${18+i*262}px;top:0;width:250px;height:560px"><div style="position:absolute;left:10px;right:10px;top:0;height:250px;border:7px solid ${PC[p]};background:radial-gradient(circle at 50% 30%,${PC[p]}aa,#000c);overflow:hidden;box-shadow:0 0 30px ${PC[p]}88"><div class="ph" style="position:absolute;inset:0">${bust(who)}</div></div><div style="position:absolute;left:0;right:0;top:262px;height:300px;background:linear-gradient(#1b1f2e,#0b0d14);border-top:10px solid ${PC[p]};display:flex;align-items:flex-start;justify-content:center;padding-top:40px;font-family:AN;color:#fff;font-size:${lab.length>5?44:72}px;text-align:center;line-height:1">${lab}</div></div>`).join('')}
 else if(k==='cartel'){w=e.w||860;h=e.h||1000;const PS=[['VOX','#5BC236'],['PP','#1E6FD9'],['PSOE','#E30613'],['FRENTE AMPLIO','#F28C28']];d.innerHTML=`<div style="position:absolute;inset:0;background:linear-gradient(#8a5a33,#6d4425);border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 14px #5b391f;padding:110px 40px 40px"><div style="position:absolute;left:50%;top:26px;transform:translateX(-50%);background:#f4f1ea;color:#222;font-family:I;font-weight:900;font-size:40px;padding:8px 40px;border-radius:6px;white-space:nowrap">${e.plate||'ESPACIO RESERVADO'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%">${PS.map(([n,c])=>`<div style="background:${c};border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 6px rgba(255,255,255,.15)"><div style="position:absolute;top:10px;left:0;right:0;text-align:center;font-family:I;font-weight:900;font-size:22px;color:#fff;opacity:.85">ELECCIONES GENERALES</div><div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-60%);text-align:center;font-family:I;font-weight:900;font-size:${n.length>5?62:110}px;color:#fff;line-height:.95">${n.replace(' ','<br>')}</div><div style="position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:#fff;color:${c};font-family:I;font-weight:900;font-size:34px;padding:2px 30px;border-radius:30px">29N</div></div>`).join('')}</div></div>`+(e.ley?`<div style="position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);background:#16213f;border:3px solid #4aa8ff;color:#8fd0ff;font-family:I;font-weight:800;font-size:34px;padding:6px 30px;border-radius:30px;white-space:nowrap;box-shadow:0 0 30px #4aa8ff88">${e.ley}</div>`:'')+(e.glow?`<div style="position:absolute;inset:-18px;border:6px solid #4aa8ff;border-radius:14px;box-shadow:0 0 50px #4aa8ff"></div>`:'')}
 else if(k==='step'){w=1;h=1}
 else if(k==='hemi'){w=900;h=520;let s='';const N=350;let n=0;for(let r=0;r<10;r++){const R=200+r*24;const m=Math.round(N/10*(0.6+r*0.09));for(let j=0;j<m&&n<N;j++,n++){const a=Math.PI*(j/(m-1));s+=`<circle cx="${450-Math.cos(a)*R}" cy="${470-Math.sin(a)*R}" r="9" fill="#fff" class="seat" data-n="${n}"/>`}}d.innerHTML=`<svg viewBox="0 0 900 520" width="900" height="520">${s}<text x="450" y="455" text-anchor="middle" font-family="AN" font-size="120" fill="#fff">${e.tx||'350'}</text></svg>`}
 else if(k==='vs'){w=180;h=180;d.innerHTML=`<div style="width:180px;height:180px;border-radius:50%;background:#e63946;border:10px solid #fff;display:flex;align-items:center;justify-content:center;font-family:I;font-weight:900;font-size:78px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)">VS</div>`}
 else if(k==='pill'){w=e.w||240;h=110;d.innerHTML=`<div style="height:110px;border-radius:55px;background:${e.bg||'#e63946'};border:8px solid #fff;display:flex;align-items:center;justify-content:center;font-family:I;font-weight:900;font-size:60px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35)">${e.tx}</div>`}
 else if(k==='pan'){w=e.w||1000;h=e.h||700;d.innerHTML=`<div class="pan" style="position:absolute;inset:0;background:${e.img?`url(${e.img}) ${e.pos||'center'}/cover no-repeat`:(e.bg||'linear-gradient(#bcd7ee,#f4efe3)')};${e.nob?'border:none;border-radius:0;box-shadow:none;':''}${e.round?'border-radius:'+e.round+'px;border:8px solid #fff;':''}"><div style="position:absolute;inset:0">${(e.inner||[]).map(x=>`<div style="position:absolute;left:${x.x}%;top:${x.y}%;width:${x.w}%;transform:translate(-50%,-50%)">${x.who?full(x.who):`<div style="font-size:${x.fs||150}px;text-align:center;line-height:1">${x.e}</div>`}</div>`).join('')}</div></div>`}
 else if(k==='bars'){w=e.w||900;h=e.h||520;const mx=Math.max(...e.items.map(i=>i.v));d.innerHTML=e.items.map((it,i)=>`<div style="position:absolute;left:0;right:0;top:${i*(h/e.items.length)}px;height:${h/e.items.length-30}px"><div style="font-family:${SK==='f6'?'PM':'I'};font-weight:900;font-size:50px;color:${SK==='f2'||SK==='f6'?'#111':'#fff'}">${it.l}</div><div class="bar" data-v="${it.v/mx}" style="height:70px;margin-top:8px;width:0;background:${it.c||'#F07A1A'};border:5px solid #111"></div><div style="position:absolute;right:0;top:0;font-family:I;font-weight:900;font-size:50px;color:${SK==='f2'||SK==='f6'?'#111':'#fff'}">${it.t||''}</div></div>`).join('')}
 d.style.width=w+'px';d.style.height=h+'px';d.style.left=(e.x/100*1080-w/2)+'px';d.style.top=(e.y/100*1920-h/2)+'px';if(e.z)d.style.zIndex=e.z;
 document.getElementById('L').appendChild(d);return d}
function init(d){D=d;SK=d.estilo||'f1';document.body.className=SK;buildBG();
 const segs=[];d.scenes.forEach(s=>s.segments.forEach(g=>segs.push(g)));SEGS=segs;
 segs.forEach((g,gi)=>{g.show.forEach(e=>{const n=mk(e);ELS.push({e,n,gi,t:e.t})})});
 // fin de vida: hasta el comienzo del primer segmento posterior que no sea keep
 ELS.forEach(o=>{let end=1e9;for(let j=o.gi+1;j<segs.length;j++){if(!o.e.keep||segs[j].show.some(x=>x.clear)){end=segs[j].hideAt;break}}o.end=end});
 window.WORDS=[];segs.forEach((g,gi)=>{const st=WORDS.length;g.words.forEach(w=>{w.st=st;w.en=st+g.words.length;WORDS.push(w)})})}
const ENT={f1:'zoom',f2:'pop',f3:'up',f4:'cut',f5:'pop',f6:'slap'};
function render(t){
 const sk=SK;
 ELS.forEach(o=>{const e=o.e,n=o.n;const a=(t-o.t)/(e.dur||0.35);const ex=(t-o.end)/0.22;
  if(a<0||ex>1){n.style.display='none';return}n.style.display='block';
  const ent=e.in||ENT[sk];let tr='',op=1;const A=cl(a);
  if(ent==='zoom'){tr=`scale(${0.6+0.4*back(A)})`;op=cl(a*3)}
  else if(ent==='pop'){tr=`scale(${A<1?back(A):1})`}
  else if(ent==='up'){tr=`translateY(${(1-ease(A))*120}px)`;op=cl(a*2)}
  else if(ent==='cut'){tr=`scale(${1.08-0.08*ease(A)})`;op=a>0?1:0}
  else if(ent==='slap'){tr=`scale(${A<1?1.4-0.4*back(A):1}) rotate(${(e.rot||((o.gi*37%9)-4))*(A<1?1:1)}deg)`;op=cl(a*4)}
  else if(ent==='left'){tr=`translateX(${-(1-ease(A))*1200}px)`}
  else if(ent==='right'){tr=`translateX(${(1-ease(A))*1200}px)`}
  // vida: flotación / ken burns
  const life=t-o.t;
  if(e.k==='por'&&sk==='f1')tr+=` scale(${1+life*0.012})`;
  if(e.k==='emo'||e.k==='pill'||e.k==='vs')tr+=` translateY(${Math.sin(life*2.4+o.gi)*8}px)`;
  if(sk==='f4'&&e.k==='pan')tr+=` scale(${1+life*0.018})`;
  if(ex>0){op*=1-cl(ex);tr+=` scale(${1-0.1*cl(ex)})`}
  n.style.transform=tr;n.style.opacity=op;
  if(e.k==='podios'){n.querySelectorAll('.pod').forEach(p=>{const on=!e.hl||e.hl===p.dataset.p;p.style.opacity=on?1:.35})}
  if(e.k==='hemi'){const k=Math.floor(cl(a/4)*350);n.querySelectorAll('.seat').forEach((c,i)=>c.setAttribute('opacity',i<k?1:.15))}
  if(e.k==='bars'){n.querySelectorAll('.bar').forEach(b=>b.style.width=(cl((a-0.5)/2)*b.dataset.v*100)+'%')}
  if(e.k==='mono'&&window.MONO_ANIM){try{MONO_ANIM(n,t,cl(a),false,Object.assign({x:e.x,g:SEGS[o.gi]},e),0)}catch(_){}}
 });
 // subtítulos
 const W=WORDS;let i=W.findIndex(w=>t>=w.t0&&t<w.t1);if(i<0){i=-1;for(let j=0;j<W.length;j++)if(W[j].t0<=t)i=j}
 const cap=document.getElementById('cap');
 if(i<0||t>W[W.length-1].t1+0.3){cap.innerHTML='';cap.style.visibility='hidden'}else{cap.style.visibility='visible';
  const N={f1:5,f2:4,f3:6,f4:1,f5:5,f6:4}[sk];const st=W[i].st;const c0=st+Math.floor((i-st)/N)*N;const ch=W.slice(c0,Math.min(c0+N,W[i].en));
  cap.innerHTML=ch.map((w,j)=>{const cur=c0+j===i;const txt=w.w.replace(/[«»]/g,'');
   if(sk==='f4')return `<span>${txt.toUpperCase()}</span>`;
   if(sk==='f3')return `<span class="${c0+j<=i?'k':''}">${txt}</span>`;
   if(sk==='f1')return `<span class="${cur?'k':''}">${txt}</span>`;
   return `<span class="${cur?'k':''}">${txt}</span>`}).join(' ');
  if(sk==='f4'){cap.style.transform=`scale(${1+0.12*Math.max(0,1-(t-W[i].t0)/0.12)})`}
 }
 // HUD
 if(sk==='f6'){const rem=Math.max(0,D.duration-t);const f=t/D.duration;const bar=document.getElementById('cdb');bar.style.width=(f*100)+'%';const c=document.getElementById('cdc');c.style.left=(f*100)+'%';c.textContent=Math.ceil(rem)}
 if(sk==='f2'){const segN=SEGS.length;let gi=SEGS.findIndex(g=>t<g.t1);if(gi<0)gi=segN-1;let step=0;ELS.forEach(o=>{if(o.e.k==='step'&&o.t<=t)step=o.e.n});document.querySelectorAll('.pb').forEach((b,j)=>{b.style.background=j===step?'#fff':'#FFCF00'});const m=document.getElementById('masc');if(m)m.style.transform=`translateY(${Math.sin(t*3)*8}px) rotate(${Math.sin(t*1.7)*4}deg)`}
 if(sk==='f1'){document.querySelectorAll('.lb').forEach(l=>{l.style.opacity=.35+.3*Math.sin(t*1.3+(+l.dataset.i))})}
 if(sk==='f3'){document.querySelectorAll('.star').forEach((s,j)=>{if(j%5==0)s.style.opacity=.2+.4*(0.5+0.5*Math.sin(t*2+j))})}
}

function renderCover(g){const P=g.portada||{};D={duration:60,fechaTxt:g.fechaTxt};SK=g.estilo||'f1';document.body.className=SK;buildBG();
 const L=document.getElementById('L');const who=P.who||[];const n=who.length;
 who.forEach((w,i)=>{const p=WHO2P[w]||'pp';const C=PC[p];const W=n==1?900:n==2?520:n==3?340:256;const x=n==1?540:(i+0.5)*1080/n;
  const d=document.createElement('div');d.className='el';d.style.cssText=`left:${x-W/2}px;top:${n==1?620:n==4?760:720}px;width:${W}px;height:${W*(n==4?1.7:1.15)}px;border-radius:24px;overflow:hidden;border:${SK==='f6'?'18px solid #fff':'12px solid '+C};box-shadow:0 0 70px ${C}99,0 20px 40px rgba(0,0,0,.45);background:radial-gradient(circle at 50% 35%,${C},#0b1024);transform:rotate(${SK==='f6'?(i%2?4:-4):0}deg)`;
  d.innerHTML=bust(w);L.appendChild(d)});
 if(P.emo){const d=document.createElement('div');d.className='el';d.style.cssText=`left:0;right:0;top:${n?1380:800}px;text-align:center;font-size:${n?220:420}px`;d.textContent=P.emo;L.appendChild(d)}
 const T=document.createElement('div');T.className='el';
 const F={f1:'AN',f2:'I',f3:'I',f4:'BG',f5:'I',f6:'PM'}[SK];const col={f2:'#111',f6:'#151515'}[SK]||'#fff';const st={f2:'0',f6:'0'}[SK]||'10px #000';
 T.style.cssText=`left:50px;right:50px;top:270px;text-align:center;font-family:${F};font-weight:900;font-size:${P.fs||150}px;line-height:.98;color:${col};-webkit-text-stroke:${st};paint-order:stroke fill;text-transform:uppercase;letter-spacing:${F==='I'?'-3px':'1px'}`;
 T.innerHTML=(P.titulo||'').replace(/\*(.+?)\*/g,`<span style="color:${SK==='f2'?'#fff;background:#111;padding:0 16px':SK==='f6'?'#151515;background:#F07A1A;padding:0 16px':'#F7D23E'}">$1</span>`);L.appendChild(T);
 if(P.sello){const s2=document.createElement('div');s2.className='el';s2.style.cssText=`left:0;right:0;top:1520px;text-align:center`;s2.innerHTML=`<span style="display:inline-block;background:#E30613;color:#fff;font-family:AN;font-size:86px;padding:6px 40px;transform:rotate(-3deg);box-shadow:0 10px 0 rgba(0,0,0,.3)">${P.sello}</span>`;L.appendChild(s2)}
 document.getElementById('cap').style.display='none';const mm=document.getElementById('masc');if(mm)mm.style.display='none';const h=document.getElementById('hud');if(SK!=='f2'&&SK!=='f6')h.innerHTML='';
}
