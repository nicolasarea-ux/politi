<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;font-weight:900;src:url(../fonts/fontsource-fraunces-5.1.0/package/files/fraunces-latin-900-normal.woff2)}
@font-face{font-family:T;font-weight:700;src:url(../fonts/fontsource-courier-prime-5.1.0/package/files/courier-prime-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(../fonts/fontsource-inter-tight-5.1.0/package/files/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(../fonts/fontsource-inter-tight-5.1.0/package/files/inter-tight-latin-900-normal.woff2)}
:root{--ink:#14213D;--paper:#F3EEE3;--card:#FFFDF8;--mark:#C8F53C;--red:#D7263D;--green:#1F9D55;--rule:rgba(20,33,61,.06)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;
 background:repeating-linear-gradient(0deg,transparent 0 63px,var(--rule) 63px 65px),
 radial-gradient(ellipse 80% 60% at 50% 35%,#FAF7F0 0%,rgba(250,247,240,0) 70%),var(--paper)}
#margin{position:absolute;top:0;bottom:0;left:72px;width:10px;border-left:3px solid rgba(215,38,61,.35);border-right:3px solid rgba(215,38,61,.35)}
/* cabecera */
#hdr{position:absolute;top:96px;left:110px;right:70px;display:flex;align-items:center;justify-content:space-between}
#htag{font:700 25px T;letter-spacing:.5px;border:3px solid var(--ink);padding:6px 14px 4px}
#hand{font:700 25px T;display:flex;align-items:center;gap:12px}
#src{position:absolute;top:156px;left:110px;font:700 22px T;opacity:.6}
#clauses{position:absolute;top:206px;left:110px;right:70px;display:flex;gap:10px;align-items:center}
.cl{flex:1;height:34px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 20px T;position:relative;overflow:hidden}
.cl i{position:absolute;inset:0;background:var(--mark);transform-origin:left;transform:scaleX(0)}
.cl b{position:relative}
/* elementos */
.el{position:absolute;transform-origin:50% 50%;will-change:transform,opacity}
.headline{font:900 104px/1.0 F;text-align:center;letter-spacing:-2px}
.mk{position:relative;display:inline-block;padding:0 10px;isolation:isolate}
.mk i{position:absolute;left:0;right:0;bottom:6px;height:58%;background:var(--mark);transform-origin:left;transform:scaleX(0) skewX(-8deg);border-radius:6px 14px 8px 12px;z-index:-1}
.card{background:var(--card);border:4px solid var(--ink);border-radius:12px;box-shadow:0 14px 0 -4px rgba(20,33,61,.14);display:flex;align-items:center;gap:30px;padding:26px 34px;font:800 54px I;position:relative}
.chk{margin-left:auto;width:76px;height:76px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;transform:scale(0)}
.stamp{font:700 64px T;letter-spacing:3px;padding:12px 28px 8px;border:7px solid currentColor;outline:3px solid currentColor;outline-offset:5px;white-space:nowrap;background:rgba(255,253,248,.55)}
.note{font:700 30px T;white-space:nowrap}
.fine{background:var(--card);border:4px solid var(--ink);border-radius:12px;padding:30px 36px;font:700 27px/1.35 T;position:relative;overflow:visible;min-height:230px}
.lens{position:absolute;width:600px;height:330px;border-radius:165px;border:14px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;font:900 62px/1.02 F;letter-spacing:-1px;padding:0 40px;box-shadow:0 18px 0 -6px rgba(20,33,61,.18)}
.lens:after{content:"";position:absolute;right:-74px;bottom:-56px;width:110px;height:30px;background:var(--ink);border-radius:15px;transform:rotate(38deg)}
#caps{position:absolute;top:1330px;left:40px;right:40px;text-align:center;font:900 60px/1.25 I;white-space:nowrap}
#caps span{display:inline-block;margin:0 5px;padding:0 10px 4px;position:relative}
#caps .now{background:var(--mark);border-radius:6px 14px 8px 12px;transform:rotate(-1deg)}
#caps .fut{opacity:.22}
#els{position:absolute;inset:0}
#prog{position:absolute;top:252px;left:110px;right:70px;height:4px;background:rgba(20,33,61,.1)}
#prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.via text,.hemi text,.grid{font-family:I;font-weight:800}
.grid{display:grid;gap:12px;font:800 46px I}
.grid .c{background:var(--card);border:4px solid var(--ink);border-radius:10px;padding:14px 10px;text-align:center;opacity:0;position:relative}
.grid .h{font:700 30px T;text-align:center;align-self:end;opacity:.75}
.grid .l{font:900 40px F;align-self:center;white-space:nowrap}
.grid .c.on{background:var(--mark)}
.grid .c .n{position:absolute;top:-22px;right:-14px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);font:900 26px/44px I;text-align:center;transform:scale(0)}
</style></head>
<body><div id="stage"><div id="margin"></div>
<div id="hdr"><div id="htag"></div><div id="hand"><span id="handle">@politizatehoy</span><span id="ast"></span></div></div>
<div id="src"></div><div id="clauses"></div><div id="prog"><i></i></div>
<div id="els"></div><div id="caps"></div></div>
<script>
const INK='#14213D',COL={red:'#D7263D',green:'#1F9D55',ink:'#14213D'};
const AST=(s,c=INK)=>`<svg width="${s}" height="${s}" viewBox="-50 -50 100 100">${[0,60,120].map(a=>`<rect x="-9" y="-46" width="18" height="92" rx="9" fill="${c}" transform="rotate(${a})"/>`).join('')}</svg>`;
const ICO={
ley:`<svg viewBox="0 0 100 100"><path d="M50 12 V84 M30 88 H70 M18 26 H82" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M18 26 L6 56 H30 Z M82 26 L70 56 H94 Z" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="12" r="6" fill="${INK}"/></svg>`,
balon:`<svg viewBox="0 0 100 100"><defs><clipPath id="bc"><circle cx="50" cy="50" r="40"/></clipPath></defs><circle cx="50" cy="50" r="40" fill="#FFFDF8"/><g clip-path="url(#bc)" fill="${INK}"><path d="M50.0 35.0 L64.3 45.4 L58.8 62.1 L41.2 62.1 L35.7 45.4Z"/><path d="M50.0 22.0 L36.7 12.3 L41.8 -3.3 L58.2 -3.3 L63.3 12.3Z"/><path d="M89.9 51.0 L76.6 41.3 L81.7 25.7 L98.2 25.7 L103.3 41.3Z"/><path d="M74.7 98.0 L61.4 88.3 L66.5 72.7 L82.9 72.7 L88.0 88.3Z"/><path d="M25.3 98.0 L12.0 88.3 L17.1 72.7 L33.5 72.7 L38.6 88.3Z"/><path d="M10.1 51.0 L-3.3 41.3 L1.8 25.7 L18.3 25.7 L23.4 41.3Z"/></g><circle cx="50" cy="50" r="40" fill="none" stroke="${INK}" stroke-width="7"/></svg>`,

roja:`<svg viewBox="0 0 100 100"><rect x="28" y="12" width="46" height="70" rx="6" fill="${COL.red}" stroke="${INK}" stroke-width="6" transform="rotate(10 50 50)"/></svg>`,
urna:`<svg viewBox="0 0 100 100"><rect x="14" y="42" width="72" height="48" rx="6" fill="none" stroke="${INK}" stroke-width="7"/><path d="M34 42 V14 H66 V42" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><path d="M40 26 H60 M40 34 H54" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M30 58 H70" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></svg>`,
train:`<svg viewBox="0 0 100 100"><rect x="22" y="10" width="56" height="64" rx="14" fill="none" stroke="${INK}" stroke-width="7"/><path d="M22 44 H78" stroke="${INK}" stroke-width="6"/><circle cx="36" cy="59" r="5" fill="${INK}"/><circle cx="64" cy="59" r="5" fill="${INK}"/><path d="M32 74 L22 92 M68 74 L78 92" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></svg>`,
clock:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="${INK}" stroke-width="7"/><path d="M50 26 V50 L66 60" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
phone:`<svg viewBox="0 0 100 100"><path d="M30 12 L44 26 L36 38 Q46 58 62 64 L74 56 L88 70 L78 84 Q40 86 16 24 Z" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/></svg>`,
plane:`<svg viewBox="0 0 100 100"><path d="M50 8 Q56 8 56 20 V40 L90 60 V68 L56 58 V78 L66 86 V92 L50 88 L34 92 V86 L44 78 V58 L10 68 V60 L44 40 V20 Q44 8 50 8 Z" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/></svg>`,
question:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="${INK}" stroke-width="7"/><path d="M38 38 Q38 24 50 24 Q62 24 62 36 Q62 46 50 50 V58" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="72" r="5" fill="${INK}"/></svg>`,
envelope:`<svg viewBox="0 0 120 90"><rect x="6" y="6" width="108" height="78" rx="8" fill="#FFFDF8" stroke="${INK}" stroke-width="7"/><path d="M8 12 L60 52 L112 12" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/></svg>`,
calendar:`<svg viewBox="0 0 100 100"><rect x="10" y="18" width="80" height="72" rx="8" fill="none" stroke="${INK}" stroke-width="7"/><path d="M10 40 H90" stroke="${INK}" stroke-width="7"/><path d="M30 8 V26 M70 8 V26" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><rect x="28" y="54" width="16" height="16" fill="${INK}"/></svg>`,
laptop:`<svg viewBox="0 0 100 100"><rect x="16" y="20" width="68" height="46" rx="5" fill="none" stroke="${INK}" stroke-width="7"/><path d="M6 80 H94" stroke="${INK}" stroke-width="8" stroke-linecap="round"/><path d="M40 43 L48 51 L62 35" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
user:`<svg viewBox="0 0 100 100"><circle cx="50" cy="28" r="16" fill="none" stroke="${INK}" stroke-width="7"/><path d="M20 92 Q20 56 50 56 Q80 56 80 92" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></svg>`,
person:`<svg viewBox="0 0 100 100"><circle cx="50" cy="28" r="16" fill="none" stroke="${INK}" stroke-width="7"/><path d="M20 92 Q20 56 50 56 Q80 56 80 92" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M14 14 L86 86" stroke="${COL.red}" stroke-width="9" stroke-linecap="round"/></svg>`,
rings:`<svg viewBox="0 0 160 110"><circle cx="58" cy="60" r="38" fill="none" stroke="${INK}" stroke-width="9"/><circle cx="102" cy="60" r="38" fill="none" stroke="${INK}" stroke-width="9"/><path d="M40 12 L58 22 L76 12" fill="none" stroke="${COL.red}" stroke-width="7" stroke-linecap="round"/><path d="M22 104 L138 6" stroke="${COL.red}" stroke-width="10" stroke-linecap="round"/></svg>`,
kids:`<svg viewBox="0 0 100 100"><circle cx="32" cy="30" r="13" fill="none" stroke="${INK}" stroke-width="7"/><circle cx="70" cy="38" r="10" fill="none" stroke="${INK}" stroke-width="7"/><path d="M12 88 Q12 52 32 52 Q52 52 52 88" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M54 88 Q54 58 70 58 Q86 58 86 88" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></svg>`,
house:`<svg viewBox="0 0 100 100"><path d="M12 48 L50 14 L88 48" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 42 V86 H78 V42" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><rect x="42" y="58" width="16" height="28" fill="${INK}"/></svg>`,
doc:`<svg viewBox="0 0 100 100"><path d="M20 8 H62 L82 28 V92 H20 Z" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><path d="M32 44 H70 M32 58 H70 M32 72 H56" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M58 52 L82 76 M82 52 L58 76" stroke="${COL.red}" stroke-width="9" stroke-linecap="round"/></svg>`
};
const mk=s=>s.replace(/\n/g,'<br>').replace(/\*(.+?)\*/g,'<span class="mk"><i></i>$1</span>');
const R={
headline:e=>`<div class="headline" style="width:${e.w}px">${mk(e.text)}</div>`,
icon:e=>`<div style="width:${e.w}px">${ICO[e.icon]}</div>`,
card:e=>`<div class="card" style="width:${e.w}px">${e.icon?`<div style="width:96px;flex:none">${ICO[e.icon]}</div>`:""}<div style="${e.icon?"":"width:100%;text-align:center"}">${fmtCnt(e.text)}</div>${e.check?`<div class="chk"><svg width="44" viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`:''}</div>`,
stamp:e=>`<div class="stamp" style="color:${COL[e.color||'red']}">${e.text}</div>`,
note:e=>`<div class="note">→ <span class="ty" data-t="${e.text}">${e.text}</span></div>`,
fineprint:e=>`<div class="fine" style="width:${e.w}px">${e.small}<div class="lens"><div>${mk(e.big)}</div></div></div>`,
logo:e=>`<div style="width:${e.w}px;text-align:center"><div style="display:inline-block;background:var(--ink);border-radius:50%;width:${e.w}px;height:${e.w}px;display:flex;align-items:center;justify-content:center"><div style="font:900 ${e.w*0.165}px/1.05 F;color:#F3EEE3;letter-spacing:-3px;text-align:center">Politízate<br><span class="mk2" style="display:inline-block;background:var(--mark);color:var(--ink);padding:0 ${e.w*0.025}px;border-radius:12px 24px 14px 20px">hoy</span></div></div><div style="font:700 28px T;margin-top:18px">* lo que no te cuentan</div></div>`
};

// ---------- piezas animadas (3-N) ----------
const lerp=(a,b,p)=>a+(b-a)*p, ease=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
function keyAt(keys,p){let i=0;while(i<keys.length-1&&p>keys[i+1].p)i++;const A=keys[i],B=keys[Math.min(i+1,keys.length-1)];
 const q=B===A?0:ease((p-A.p)/(B.p-A.p));const o={};for(const k in A){o[k]=(typeof A[k]==='number'&&typeof B[k]==='number')?lerp(A[k],B[k],q):(q<1?A[k]:B[k])}return o}
const TRAIN=(lab,fill)=>`<g><rect x="-150" y="-34" width="300" height="68" rx="34" fill="${fill}" stroke="${INK}" stroke-width="6"/><rect x="-110" y="-16" width="40" height="22" rx="5" fill="#FFFDF8" stroke="${INK}" stroke-width="4"/><rect x="-50" y="-16" width="40" height="22" rx="5" fill="#FFFDF8" stroke="${INK}" stroke-width="4"/><rect x="10" y="-16" width="40" height="22" rx="5" fill="#FFFDF8" stroke="${INK}" stroke-width="4"/><text x="100" y="12" text-anchor="middle" font-size="30" fill="${INK}">${lab}</text></g>`;
R.via=e=>{const W=e.w||980;let sl='';for(let x=-40;x<W+80;x+=46)sl+=`<rect x="${x}" y="226" width="14" height="52" fill="${INK}" opacity=".25"/>`;
 return `<div class="via" style="width:${W}px"><svg width="${W}" height="470" viewBox="0 0 ${W} 470" style="overflow:visible">
 <g class="sl">${sl}</g><path d="M-60 238 H${W+60} M-60 266 H${W+60}" stroke="${INK}" stroke-width="6"/>
 <text x="${W-6}" y="330" text-anchor="end" font-size="30" fill="${INK}">${e.dest||''} →</text>
 <g class="sig" transform="translate(${W*(e.sig??0.82)},120)"><path d="M0 40 V118" stroke="${INK}" stroke-width="8"/><rect x="-30" y="-46" width="60" height="96" rx="16" fill="${INK}"/><circle class="lt" cx="0" cy="-16" r="17" fill="#555"/><circle class="lt2" cx="0" cy="22" r="17" fill="#555"/><text x="44" y="-6" font-size="26" fill="${INK}">${e.sigLabel||''}</text></g>
 <g class="tA">${TRAIN(e.a||'IRYO','#E9E4D6')}</g><g class="tB">${TRAIN(e.b||'AVE','#FFFDF8')}</g>
 <g class="boom" opacity="0"><path d="${[...Array(16)].map((_,i)=>{const r=i%2?46:110,a=i*Math.PI/8;return (i?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)}).join(' ')}Z" fill="${COL.red}" stroke="${INK}" stroke-width="6"/></g>
 <g class="clk" transform="translate(70,40)"><rect x="-6" y="-44" width="220" height="80" rx="14" fill="${INK}"/><text class="ct" x="104" y="16" text-anchor="middle" font-size="54" fill="#F3EEE3">8:30</text></g>
 <text class="lab" x="${W/2}" y="420" text-anchor="middle" font-size="40" fill="${INK}"></text></svg></div>`};
const A={};
A.via=(e,n,a,life)=>{const W=e.w||980,p=e.keys[0].g!==undefined?(e.t+a):clamp(a/Math.max(life-0.3,0.5)),k=keyAt(e.keys,p);
 const y=252, xA=k.a*W, xB=k.b*W;
 n.querySelector('.tA').setAttribute('transform',`translate(${xA},${y})`);
 const shake=k.boom?Math.sin(a*70)*4*Math.exp(-(p-k.boomP||0)*6):0;
 n.querySelector('.tB').setAttribute('transform',`translate(${xB+shake},${y}) rotate(${k.boom?-3:0})`);
 n.querySelector('.sl').setAttribute('transform',`translate(${-((a*(k.speed||0)*300)%46)},0)`);
 const L1=n.querySelector('.lt'),L2=n.querySelector('.lt2');L1.setAttribute('fill',k.sig==='red'?COL.red:'#555');L2.setAttribute('fill',k.sig==='green'?COL.green:(k.sig==='off'?'#555':'#555'));
 if(k.sig==='off'){const bl=(Math.floor(a*3)%2)?.25:1;L1.setAttribute('opacity',bl);L2.setAttribute('opacity',bl)}else{L1.setAttribute('opacity',1);L2.setAttribute('opacity',1)}
 n.querySelector('.ct').textContent=k.clk||'';
 const b=n.querySelector('.boom');b.setAttribute('opacity',k.boom?1:0);b.setAttribute('transform',`translate(${(xA+xB)/2},${y}) scale(${k.boom?1+0.15*Math.sin(a*12):0}) rotate(${a*30})`);
 n.querySelector('.lab').textContent=k.lab||'';
};
// hemiciclo: 350 puntos, ordenados de izquierda a derecha
function hemiPts(N,W){const rows=12,R1=W*0.47,R0=W*0.17,pts=[];const radii=[...Array(rows)].map((_,i)=>R0+(R1-R0)*i/(rows-1));
 const tot=radii.reduce((x,r)=>x+r,0);let left=N;radii.forEach((r,i)=>{let n=i===rows-1?left:Math.round(N*r/tot);left-=n;for(let j=0;j<n;j++){const a=Math.PI*(1-j/(n-1));pts.push({x:W/2+r*Math.cos(a),y:W*0.5-r*Math.sin(a),a})}});
 return pts.sort((p,q)=>q.a-p.a)}
R.hemi=e=>{const W=e.w||900,P=hemiPts(e.n||350,W);
 return `<div class="hemi" style="width:${W}px"><svg width="${W}" height="${W*0.5+170}" viewBox="0 0 ${W} ${W*0.5+170}" style="overflow:visible">${P.map(q=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${W*0.0125}" fill="#D9D3C4"/>`).join('')}
 <g class="mj" opacity="0"><path d="M${W/2} -16 V${W*0.5+8}" stroke="${COL.red}" stroke-width="7" stroke-dasharray="16 12"/><rect x="${W/2-86}" y="-86" width="172" height="62" rx="12" fill="${COL.red}"/><text x="${W/2}" y="-42" text-anchor="middle" font-size="40" fill="#fff">${e.line||176}</text></g>
 <text class="cnt" x="${W/2}" y="${W*0.5+6}" text-anchor="middle" font-size="120" font-family="F" font-weight="900" fill="${INK}">0</text>
 <text x="${W/2}" y="${W*0.5+70}" text-anchor="middle" font-size="36" fill="${INK}">${e.unit||'escaños'}</text></svg></div>`};
A.hemi=(e,n,a,life)=>{const C=n.__c||(n.__c=[...n.querySelectorAll('circle')]);const fd=e.fillDur||2.2;
 const groups=e.fill||[{n:C.length,c:INK}];let tot=groups.reduce((x,g)=>x+g.n,0);const k=Math.floor(clamp((a-0.3)/fd)*tot);
 let i=0;groups.forEach(g=>{for(let j=0;j<g.n;j++,i++){if(!C[i])continue;C[i].setAttribute('fill',i<k?(COL[g.c]||g.c):'#D9D3C4');C[i].setAttribute('r',(e.w||900)*0.0125*(i<k&&i>k-8?1.35:1))}});
 n.querySelector('.cnt').textContent=e.count===false?'':Math.min(k,tot);
 if(e.line){const q=clamp((a-0.3-fd)/0.4);const m=n.querySelector('.mj');m.setAttribute('opacity',q);}
};
// tabla de cocientes (D'Hondt)
R.grid=e=>{const cols=e.cols.length;let h=`<div class="grid" style="width:${e.w||940}px;grid-template-columns:230px repeat(${cols},1fr)"><div></div>`+e.cols.map(c=>`<div class="h">${c}</div>`).join('');
 e.rows.forEach((r,ri)=>{h+=`<div class="l">${r.label}</div>`+r.vals.map((v,ci)=>`<div class="c" data-k="${ri}-${ci}">${v}<div class="n"></div></div>`).join('')});return h+'</div>'};
A.grid=(e,n,a,life)=>{const cells=[...n.querySelectorAll('.c')];const step=e.step||0.12;
 cells.forEach((c,i)=>{const q=clamp((a-i*step)/0.25);c.style.opacity=q;c.style.transform=`scale(${back(q)})`});
 const t0=cells.length*step+(e.wait||0.6);(e.win||[]).forEach((k,j)=>{const c=n.querySelector(`[data-k="${k}"]`);if(!c)return;const q=a-(t0+j*(e.winStep||0.45));
  c.classList.toggle('on',q>0);const nb=c.querySelector('.n');nb.textContent=j+1;nb.style.transform=`scale(${back(q/0.3)})`})};
const fmtCnt=s=>s.replace(/\{(\d+)\}/g,'<span class="cu" data-to="$1">$1</span>');

let D,lastS=-1;
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const back=p=>{p=clamp(p);const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const outQ=p=>1-Math.pow(1-clamp(p),3);
let DATA_BRAND='Politízate Hoy';
function init(d){D=d;DATA_BRAND=d.brand||DATA_BRAND;
 document.getElementById('htag').textContent=d.header.tag||'';
 document.getElementById('src').textContent=d.header.source||'';
 document.getElementById('ast').innerHTML=AST(44);
 const cb=document.getElementById('clauses');
 const L=d.clauseLabels||[];let h='';for(let i=1;i<=d.clauses;i++)h+=`<div class="cl" data-c="${i}"><i></i><b>${L[i-1]||'CLÁUSULA '+i}</b></div>`;
 h+=`<div class="cl" data-c="-1" style="flex:1.3"><i></i><b>${L[d.clauses]||'LETRA PEQUEÑA*'}</b></div>`;cb.innerHTML=h;
 const box=document.getElementById('els');
 d.scenes.forEach((s,si)=>s.segments.forEach(g=>g.show.forEach(e=>{
  const n=document.createElement('div');n.className='el';n.innerHTML=R[e.type](e);n.style.opacity=0;box.appendChild(n);e.n=n;
  e.si=si;if(e.keys&&e.keys[0].g!==undefined)e.keys.forEach(k=>{const S2=d.scenes[Math.min(si+(k.s||0),d.scenes.length-1)],G=S2.segments[Math.min(k.g,S2.segments.length-1)];k.p=G.t0+(k.f||0)*(G.t1-G.t0)});
  e.hideT=(si===d.scenes.length-1)?d.duration+1:(e.keep?(d.scenes[Math.min(si+e.keep,d.scenes.length-1)].t1):s.t1);d.scenes.forEach(s3=>s3.segments.forEach(g2=>{if(g2.hide.includes(e.id)&&g2.t0>e.t&&g2.t0<e.hideT)e.hideT=g2.t0}));
 })));
 return document.fonts.ready.then(()=>{d.scenes.forEach(s=>s.segments.forEach(g=>g.show.forEach(e=>{const r=e.n.firstElementChild.getBoundingClientRect();e.W=r.width;e.H=r.height})));return 1});
}
let stampKick=0;
function render(t){
 const sc=D.scenes;let si=sc.findIndex(s=>t<s.t1);if(si<0)si=sc.length-1;const S=sc[si];
 // cláusulas
 const order=[];document.querySelectorAll('.cl').forEach(c=>order.push(+c.dataset.c));
 document.querySelectorAll('.cl').forEach(c=>{const ci=+c.dataset.c;
  const sIdx=sc.findIndex(s=>s.clause===ci);let f=0;
  if(sIdx>=0){const s=sc[sIdx];f=clamp((t-s.t0)/(s.t1-s.t0));}
  c.querySelector('i').style.transform=`scaleX(${f})`;});
 document.querySelector('#prog i').style.width=clamp(t/D.duration)*100+'%';
 // asterisco esquina
 let kick=0;sc.forEach(s=>s.segments.forEach(g=>g.show.forEach(e=>{if(e.type==='stamp'&&t>=e.t&&t<e.t+0.4)kick=Math.max(kick,1-(t-e.t)/0.4)})));
 document.getElementById('ast').style.transform=`rotate(${t*40}deg) scale(${1+kick*0.5})`;
 // elementos
 sc.forEach(s=>s.segments.forEach(g=>g.show.forEach(e=>{
  const n=e.n;if(t<e.t||t>e.hideT+0.3){n.style.opacity=0;return}
  const a=t-e.t, out=t>e.hideT?outQ((t-e.hideT)/0.3):0;
  let sc1=1,dy=0,op=1,rot=e.rot||0;
  if(e.type==='stamp'){sc1=a<0.16?1.9-0.9*(a/0.16):1+0.04*Math.exp(-(a-0.16)*14)*Math.sin((a-0.16)*60);op=clamp(a/0.08)}
  else if(e.type==='headline'||e.type==='note'){dy=(1-outQ(a/0.35))*40;op=clamp(a/0.25)}
  else{sc1=back(a/0.45);op=clamp(a/0.1);rot+=(1-outQ(a/0.5))*-4}
  dy-=out*70;op*=1-out;
  const x=1080*e.x/100-e.W/2,y=1920*e.y/100-e.H/2+dy+Math.sin(t*1.8+e.x+e.y)*2;
  n.style.opacity=op;n.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${Math.max(sc1,0)})`;
  n.querySelectorAll('.mk i').forEach(m=>m.style.transform=`scaleX(${outQ((a-0.3)/0.45)}) skewX(-8deg)`);
  const ck=n.querySelector('.chk');if(ck)ck.style.transform=`scale(${back((a-0.45)/0.35)})`;
  const ty=n.querySelector('.ty');if(ty){const s2=ty.dataset.t;ty.textContent=s2.slice(0,Math.floor(clamp(a/0.9)*s2.length))}
  const ln=n.querySelector('.lens');if(ln){const p=outQ((a-0.9)/0.7);ln.style.left=(e.W-600)/2+(1-p)*700+'px';ln.style.top='-50px';ln.style.opacity=clamp((a-0.9)/0.15);ln.querySelectorAll('.mk i').forEach(m=>m.style.transform=`scaleX(${outQ((a-1.7)/0.45)}) skewX(-8deg)`)}
  n.querySelectorAll('.cu').forEach(c=>{const to=+c.dataset.to;c.textContent=Math.round(to*outQ((a-0.15)/0.9))});
  if(A[e.type])A[e.type](e,n,a,e.hideT-e.t);
  const lg=n.querySelector('.lg');if(lg)lg.style.transform=`rotate(${a*60}deg)`;
 })));
 { const k=clamp((t-S.t0)/Math.max(S.t1-S.t0,0.1)); const z=1+0.045*ease(k)+kick*0.015; const box=document.getElementById('els'); box.style.transformOrigin='50% 38%'; box.style.transform=`scale(${z}) translateY(${-10*ease(k)}px)`; }
 // subtítulos
 let chunks=[],cur=[];
 S.segments.forEach(g=>g.words.forEach((w,i)=>{cur.push(w);if(cur.length>=4||cur.map(x=>x.w).join(' ').length>=19||/[,.:;!?]$/.test(w.w)||i===g.words.length-1){chunks.push(cur);cur=[]}}));
 const ch=chunks.find(c=>t<c[c.length-1].t1+0.05);const cp=document.getElementById('caps');
 cp.innerHTML=(!ch||t<S.t0)?'':ch.map(w=>`<span class="${t>=w.t0&&t<w.t1?'now':(t<w.t0?'fut':'')}">${w.w}</span>`).join('');
}
</script>

<script>
async function renderCover(g){
 document.getElementById('stage').style.display='none';
 const c=document.getElementById('cover'); c.style.display='block'; if(g.tono==='serio')c.classList.add('serio');
 const p=g.portada||{}; const first=g.scenes[0].segments.flatMap(s=>s.show);
 const head=(first.find(e=>e.type==='headline')||{}).text||'';
 const ic=p.icono||(first.find(e=>e.type==='icon')||first.find(e=>e.icon)||{}).icon||'doc';
 c.querySelector('.ser').textContent=p.serie||((g.header||{}).tag||'').split('·')[0].trim();
 const tt=p.titulo||head; const t=c.querySelector('.tit'); t.innerHTML=mk(tt);
 const n=tt.replace(/\*/g,'').length; t.style.fontSize=(p.tam||(n>26?122:n>16?140:166))+'px';
 let gr=p.grande;
 if(!gr&&ic==='user'){ // quién es quién: iniciales en vez del muñequito
  const w=tt.replace(/[*¿?]/g,'').split(/\s+/).filter(x=>x&&x[0]===x[0].toUpperCase()&&/\p{L}/u.test(x[0]));
  gr=(w.length>1?w[0][0]+w[w.length-1][0]:(w[0]||'').slice(0,2)).toUpperCase();
 }
 const v=c.querySelector('.vis');
 if(p.escena){const e=Object.assign({t:0},p.escena);v.classList.add('esc');v.innerHTML=R[e.type](e);
  if(e.type==='via'){e.keys=[Object.assign({p:0,speed:0,boom:false,lab:''},e.estado||{})];}
  if(A[e.type])A[e.type](e,v,99,100);}
 else {
 v.innerHTML=gr?`<div class="big">${gr}</div>`:(ICO[ic]||'');
 if(gr){const L=[...gr].length; v.querySelector('.big').style.fontSize=(L===1?360:L<=2?250:L<=3?210:L<=4?170:L<=6?120:96)+'px';} }
 const sb=c.querySelector('.sub'); sb.textContent=p.sub||''; sb.style.display=p.sub?'block':'none';
 await document.fonts.ready;
}
</script>
